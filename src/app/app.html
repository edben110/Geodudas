<main class="welcome">
  <!-- ── Encabezado de marca ────────────────────────────────── -->
  <header class="brand" [class.brand--compact]="hasStarted()">
    <img class="brand__logo" src="/images/logo-geodudas.svg" alt="" />
    <div class="brand__text">
      <h1>GeoDudas</h1>
      <p>Explora, aprende y comprende el mundo</p>
    </div>
  </header>

  <!-- ── Vista de login ────────────────────────────────────── -->
  <ng-container *ngIf="!hasStarted(); else studentDashboard">
    <app-login (sessionStarted)="onSessionStarted($event)"></app-login>
  </ng-container>

  <!-- ── Vista del dashboard (post-login) ──────────────────── -->
  <ng-template #studentDashboard>
    <app-dashboard-estudiante
      [studentName]="studentName()"
      [avatar]="selectedAvatar()"
      (loggedOut)="logout()"
    ></app-dashboard-estudiante>
  </ng-template>
</main>
